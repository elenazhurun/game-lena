<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бухгалтерия возвращается домой</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07070c; }
  body { display: grid; place-items: center; font-family: monospace; color: #83769c; }
  #tv {
    position: relative; width: 972px; height: 690px; box-sizing: border-box;
    padding: 36px 36px 54px; border-radius: 46px;
    background: linear-gradient(160deg, #2b2b3a 0%, #15151f 55%, #0c0c13 100%);
    box-shadow: 0 0 0 3px #000, 0 20px 60px rgba(0,0,0,.8), inset 0 2px 0 rgba(255,255,255,.08), inset 0 -6px 12px rgba(0,0,0,.6);
    transform-origin: center center; flex: none;
  }
  #screen {
    position: relative; width: 900px; height: 600px; border-radius: 28px; overflow: hidden;
    background: #000; box-shadow: 0 0 0 4px #050508, inset 0 0 40px rgba(0,0,0,.9);
  }
  #c { display: block; width: 900px; height: 600px; image-rendering: pixelated; image-rendering: crisp-edges; }
  #scan {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.22) 3px);
    mix-blend-mode: multiply;
  }
  #glare {
    position: absolute; inset: 0; pointer-events: none; border-radius: 28px;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(255,255,255,0) 55%, rgba(0,0,0,.45) 100%),
      linear-gradient(115deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 30%);
  }
  #panel { position: absolute; left: 36px; right: 36px; bottom: 14px; height: 30px; display: flex; align-items: center; gap: 14px; font-size: 11px; letter-spacing: 2px; }
  #panel .led { width: 9px; height: 9px; border-radius: 50%; background: #ff004d; box-shadow: 0 0 8px #ff004d; }
  #panel .knob { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #5f574f, #1a1a22); box-shadow: 0 0 0 2px #000; }
  #panel .sp { flex: 1; }
  #panel .grille { width: 90px; height: 14px; background: repeating-linear-gradient(90deg, #000 0 2px, #22222e 2px 5px); border-radius: 3px; }
  noscript { color: #fff1e8; }
</style>
</head>
<body>
<div id="tv">
  <div id="screen">
    <canvas id="c" width="900" height="600"></canvas>
    <div id="scan"></div>
    <div id="glare"></div>
  </div>
  <div id="panel"><span class="led"></span><span>ЛЕНА-ТВ</span><span class="sp"></span><span class="grille"></span><span class="knob"></span><span class="knob"></span></div>
</div>
<noscript>Для игры нужен JavaScript.</noscript>
<script>

var FONT_SRC = {

 'Э':'.###.|#...#|....#|..###|....#|#...#|.###.', 'Ю':'#..#.|#.#.#|#.#.#|###.#|#.#.#|#.#.#|#..#.',
 'Я':'.####|#...#|#...#|.####|..#.#|.#..#|#...#',

 'Y':'#...#|#...#|.#.#.|..#..|..#..|..#..|..#..', 'V':'#...#|#...#|#...#|#...#|.#.#.|.#.#.|..#..',

 '8':'.###.|#...#|#...#|.###.|#...#|#...#|.###.', '9':'.###.|#...#|#...#|.####|....#|....#|.###.',
 '.':'.....|.....|.....|.....|.....|.....|..#..', ',':'.....|.....|.....|.....|.....|..#..|.#...',
 '!':'..#..|..#..|..#..|..#..|..#..|.....|..#..', '?':'.###.|#...#|....#|...#.|..#..|.....|..#..',
 ':':'.....|.....|..#..|.....|.....|..#..|.....', '-':'.....|.....|.....|.###.|.....|.....|.....',
 '+':'.....|..#..|..#..|#####|..#..|..#..|.....', '/':'....#|....#|...#.|..#..|.#...|#....|#....',
 '%':'##..#|##..#|...#.|..#..|.#...|#..##|#..##', '(':'...#.|..#..|.#...|.#...|.#...|..#..|...#.',
 ')':'.#...|..#..|...#.|...#.|...#.|..#..|.#...', "'":'..#..|..#..|.#...|.....|.....|.....|.....',
 '"':'.#.#.|.#.#.|.....|.....|.....|.....|.....', '₽':'####.|#...#|#...#|####.|#####|#....|#....',
 '←':'.....|..#..|.#...|#####|.#...|..#..|.....', '→':'.....|..#..|...#.|#####|...#.|..#..|.....',
 '↑':'..#..|.###.|#.#.#|..#..|..#..|..#..|.....', '↓':'.....|..#..|..#..|..#..|#.#.#|.###.|..#..',
 '*':'.....|#.#.#|.###.|#####|.###.|#.#.#|.....', '=':'.....|.....|#####|.....|#####|.....|.....'
};
var FONT = {};
(function () {
  for (var ch in FONT_SRC) {
    var rows = FONT_SRC[ch].split('|'), x0 = 5, x1 = -1;
    for (var r = 0; r < 7; r++) for (var c = 0; c < 5; c++) if (rows[r][c] === '#') { if (c < x0) x0 = c; if (c > x1) x1 = c; }
    if (x1 < 0) { x0 = 0; x1 = 0; }
    FONT[ch] = { rows: rows, x0: x0, w: x1 - x0 + 1 };
  }
})();
var LATIN_MAP = { 'А':'A','В':'B','Е':'E','К':'K','М':'M','Н':'H','О':'O','Р':'P','С':'C','Т':'T','Х':'X' };
function glyph(ch) { ch = ch.toUpperCase(); if (ch === '—' || ch === '–') ch = '-'; if (ch === '«' || ch === '»') ch = '"'; return FONT[ch] || FONT[LATIN_MAP[ch]]; }
function textWidth(s) { var w = 0; for (var i = 0; i < s.length; i++) { var gl = glyph(s[i]); w += (s[i] === ' ' ? 3 : (gl ? gl.w : 3)) + 1; } return Math.max(0, w - 1); }
var textCache = {};
function textCanvas(s, color) {
  var key = color + '|' + s, cv = textCache[key];
  if (cv) return cv;
  cv = document.createElement('canvas'); cv.width = Math.max(1, textWidth(s)); cv.height = 8;
  var t = cv.getContext('2d'); t.fillStyle = color; var x = 0;
  for (var i = 0; i < s.length; i++) {
    var gl = glyph(s[i]);
    if (s[i] === ' ' || !gl) { x += 4; continue; }
    for (var r = 0; r < 7; r++) for (var c = 0; c < 5; c++) if (gl.rows[r][c] === '#') t.fillRect(x + c - gl.x0, r + 1, 1, 1);
    x += gl.w + 1;
  }
  textCache[key] = cv; return cv;
}
// align: 'l' | 'c' | 'r'; shadow — тёмная тень для читаемости
function drawText(s, x, y, color, scale, align, shadow) {
  scale = scale || 1; var cv = textCanvas(s, color), w = cv.width * scale;
  if (align === 'c') x = x - (w >> 1); else if (align === 'r') x = x - w;
  x = x | 0; y = y | 0;
  if (shadow) g.drawImage(textCanvas(s, shadow), x + scale, y + scale, w, 8 * scale);
  g.drawImage(cv, x, y, w, 8 * scale);
}

// ---------- спрайты из строк (цифры hex = индекс палитры) ----------
function makeSprite(rows, flip) {
  var h = rows.length, w = rows[0].length, cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  var t = cv.getContext('2d');
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
    var ch = rows[y][x]; if (ch === '.') continue;
    t.fillStyle = PAL[parseInt(ch, 16)]; t.fillRect(flip ? w - 1 - x : x, y, 1, 1);
  }
  return cv;
}
var SPR_SRC = {
  heart: ['.88.88.','8788888','8888888','.88888.','..888..','...8...'],
  heartOff: ['.55.55.','5555555','5555555','.55555.','..555..','...5...'],
  coin: ['.9999.','9aaaa9','9a7aa9','9aaaa9','9aaaa9','.9999.'],
  coffee: ['..7.7...','.7.7....','.888888.','.8888887','.8777787','.888887.','..8888..','........'],
  bread: ['..9999..','.94a4a9.','9a4a4a49','94a4a4a9','.999999.'],
  milk: ['..777..','.77c77.','.7ccc7.','.7c7c7.','.7ccc7.','.77777.','.77777.'],
  potato: ['.4f44.','4f4f44','f4f4f4','4f444f','.4f4f.'],
  pigeon: ['...66..','..6666.','66666f9','.66666.','..5.5..'],
  pigeon2: ['.66....','66666..','.6666f9','..666..','..5.5..'],
  cat: ['5.5....','555....','5555555','55555555','5555555.','5.5.5.5.'],
  dogStray: ['......55..','.....5555.','....55555f','555555555.','55555555..','5.5...5.5.'],
  dogHome: ['.....44...','....4444f.','...44444f8','4444444444','444444444.','4.4....4.4'],
  ball: ['.888.','88778','88888','.888.'],
  paper: ['77777','76767','77777','66666'],
  door: ['.44444444.','4dddddddd4','4d444444d4','4d4dddd4d4','4d444444d4','4d4dddd4d4','4d444444d4','4dddddddd4','4dddddddd4','4ddddaddd4'],
  puddle: ['..cccc..','.c7ccccc','cccccccc','.cccccc.'],
  bag: ['..5.5..','.5...5.','4444444','4a44a44','4444444','4444444']
};
var SPR = {}, SPRF = {};
for (var k in SPR_SRC) { SPR[k] = makeSprite(SPR_SRC[k], false); SPRF[k] = makeSprite(SPR_SRC[k], true); }
function drawSpr(name, x, y, flip) { g.drawImage((flip ? SPRF : SPR)[name], x | 0, y | 0); }

// ---------- человечки, нарисованные прямоугольниками ----------
// o: skin, hair, hs (стиль волос), top, top2, bot, skirt, shoe, glasses, tie, fat, kerchief, hood, mug, bag, apron
var PEOPLE = {
  lena:   { skin:C.sk, hair:C.br, hs:'bun', top:C.wh, top2:C.lg, bot:C.nb, skirt:true, shoe:C.rd, glasses:true, bag:true, lanyard:true },
  boss:   { skin:C.sk, hair:C.lg, hs:'bald', top:C.nb, top2:C.k, bot:C.nb, shoe:C.k, tie:C.rd, fat:true, mus:true },
  lyuda:  { skin:C.sk, hair:C.or, hs:'perm', top:C.dg, top2:C.k, bot:C.br, skirt:true, shoe:C.k, glasses:true, mug:true },
  it:     { skin:C.sk, hair:C.k, hs:'short', top:C.lv, top2:C.dk, bot:C.nb, shoe:C.wh, hood:true, phones:true },
  manager:{ skin:C.sk, hair:C.k, hs:'gel', top:C.bl, top2:C.nb, bot:C.dk, shoe:C.k, tie:C.ye },
  babka:  { skin:C.sk, hair:C.pk, hs:'kerchief', top:C.dg, top2:C.k, bot:C.br, skirt:true, shoe:C.k, sack:true },
  guard:  { skin:C.sk, hair:C.k, hs:'cap', top:C.k, top2:C.nb, bot:C.k, shoe:C.k, fat:true },
  promo:  { skin:C.sk, hair:C.ye, hs:'short', top:C.or, top2:C.br, bot:C.nb, shoe:C.wh, flyer:true },
  husband:{ skin:C.sk, hair:C.br, hs:'short', top:C.lg, top2:C.dk, bot:C.nb, shoe:C.br, fat:true, mus:true },
  neighbor:{ skin:C.sk, hair:C.dk, hs:'short', top:C.rd, top2:C.pu, bot:C.dk, shoe:C.k, bike:true }
};

function drawPerson(x, y, dir, frame, o, extra) {
  // (x,y) — левый верхний угол коробки 12x20; рисуем лицом вправо, при dir<0 зеркалим
  x = x | 0; y = y | 0;
  function px(rx, ry, w, h, c) { g.fillStyle = c; g.fillRect(dir < 0 ? x + 12 - rx - w : x + rx, y + ry, w, h); }
  var wf = frame === 1 || frame === 3, tog = frame === 2, jump = frame === 4, hit = frame === 5;
  var bob = (wf ? 0 : (tog ? 0 : 0));
  var fat = o.fat ? 1 : 0;
  // ноги
  if (jump) { px(4, 17, 2, 2, o.skirt ? o.skin : o.bot); px(7, 16, 2, 2, o.skirt ? o.skin : o.bot); px(4, 18, 2, 2, o.shoe); px(7, 17, 2, 2, o.shoe); }
  else {
    var a = wf ? 3 : (tog ? 5 : 4), b = wf ? 8 : (tog ? 6 : 7);
    var legc = o.skirt ? o.skin : o.bot;
    px(a, 17, 2, 2, legc); px(b, 17, 2, 2, legc); px(a - (wf && !o.skirt ? 0 : 0), 19, 2, 1, o.shoe); px(b + (wf ? 1 : 0), 19, 2, 1, o.shoe);
    if (!o.skirt) { px(a, 14, 2, 3, o.bot); px(b, 14, 2, 3, o.bot); }
  }
  // низ: юбка или штаны
  if (o.skirt) { px(2, 14, 8, 1, o.bot); px(2, 15, 8, 2, o.bot); px(3, 13, 6, 1, o.bot); }
  else { px(3 - fat, 13, 6 + 2 * fat, 2, o.bot); px(3, 15, 6, 2, o.bot); }
  // торс
  px(3 - fat, 8, 6 + 2 * fat, 5, o.top);
  px(3 - fat, 8, 6 + 2 * fat, 1, o.top2);
  if (o.hood) { px(2, 7, 8, 2, o.top); px(2, 8, 2, 4, o.top2); }
  if (o.tie) { px(6, 9, 1, 4, o.tie); }
  if (o.lanyard) { px(6, 8, 1, 3, C.bl); px(6, 11, 2, 1, C.wh); }
  if (o.apron) { px(3, 10, 6, 5, o.apron); }
  // рука
  var ax = wf ? 6 : (tog ? 4 : 5);
  if (jump || hit) { px(6, 5, 2, 5, o.top); px(6, 4, 2, 1, o.skin); }
  else { px(ax, 9, 2, 4, o.top2); px(ax, 13, 2, 1, o.skin); }
  if (o.mug) { px(ax + 2, 12, 3, 3, C.wh); px(ax + 2, 12, 3, 1, C.br); }
  if (o.flyer) { px(ax + 2, 11, 3, 4, C.wh); }
  if (o.bag) { px(ax - 2, 12, 5, 4, C.pk); px(ax - 1, 11, 3, 1, C.pu); }
  if (o.sack) { px(ax + 2, 13, 4, 5, C.br); px(ax + 3, 12, 2, 1, C.dk); }
  // шея и голова
  px(5, 7, 2, 1, o.skin);
  px(3, 2, 6, 5, o.skin);
  px(9, 4, 1, 1, o.skin);                  // нос
  px(7, 3, 1, 1, C.k);                     // глаз
  if (o.mus) px(6, 5, 3, 1, o.hair === C.lg ? C.dk : C.br);
  if (o.glasses) { px(6, 3, 1, 1, C.wh); px(7, 3, 1, 1, C.k); px(8, 3, 1, 1, C.k); px(5, 3, 1, 1, C.k); px(6, 2, 3, 1, C.k); }
  // волосы
  var hs = o.hs, hc = o.hair;
  if (hs === 'bun') { px(3, 1, 6, 2, hc); px(2, 1, 2, 5, hc); px(0, 0, 3, 3, hc); px(1, 3, 1, 1, hc); }
  else if (hs === 'perm') { px(2, 0, 8, 3, hc); px(1, 1, 3, 6, hc); px(9, 1, 1, 2, hc); }
  else if (hs === 'short') { px(3, 1, 6, 2, hc); px(2, 2, 2, 3, hc); }
  else if (hs === 'gel') { px(3, 0, 7, 2, hc); px(2, 1, 2, 4, hc); }
  else if (hs === 'bald') { px(2, 3, 2, 3, hc); px(3, 1, 6, 1, C.sk); }
  else if (hs === 'kerchief') { px(2, 1, 8, 2, hc); px(2, 3, 2, 5, hc); px(9, 3, 1, 1, hc); px(1, 6, 2, 2, hc); }
  else if (hs === 'cap') { px(2, 1, 8, 2, C.nb); px(8, 3, 3, 1, C.nb); px(5, 0, 2, 1, C.rd); }
  if (o.phones) { px(2, 3, 2, 3, C.rd); px(3, 1, 6, 1, C.rd); }
  if (extra && extra.stun) { g.fillStyle = C.ye; var t = (extra.t >> 3) & 1; g.fillRect(x + 2 + t * 6, y - 3, 2, 2); g.fillRect(x + 8 - t * 6, y - 4, 2, 2); }
}

// ---------- ввод ----------
var keys = {}, pressedNow = {};
var PREVENT = { ArrowUp:1, ArrowDown:1, ArrowLeft:1, ArrowRight:1, Space:1, PageUp:1, PageDown:1, Home:1, End:1, Enter:1, Tab:1 };
window.addEventListener('keydown', function (e) {
  if (PREVENT[e.code]) e.preventDefault();
  if (!keys[e.code]) pressedNow[e.code] = true;
  keys[e.code] = true; audioUnlock();
}, { passive: false });

// ---------- состояние игры ----------

function mkEnemy(d) {

function updatePlayer(controls) {
  var want = 0;

  if (controls && !down(K_JUMP) && P.vy < -2) P.vy = -2;

  if (Math.abs(P.vx) > .3 && P.onG) P.ft += Math.abs(P.vx) * .6; else if (P.onG) P.ft = 0;

    });

function updateEnemies() {
  var pb = pbox(), pcx = P.x + 6;
  for (var i = ents.length - 1; i >= 0; i--) {
    var e = ents[i];

        if (e.sayCd <= 0 && e.sayT <= 0 && onScreen) { say(e, ['ЛЕНА! СРОЧНО!', 'КУДА?! ЕЩЁ ЧАС!', 'ЭТО ПОДПИШЕШЬ!', 'ПРЕМИИ НЕ БУДЕТ!'][(Math.random() * 4) | 0], 100); e.sayCd = 200; }
      } else if (e.t === 'dog') {

    }
  }
  if (msgT > 0) { var mw = textWidth(msgTxt) + 8; rect(150 - (mw >> 1), 30, mw, 11, C.rd); drawText(msgTxt, 150, 32, C.wh, 1, 'c'); }
}

function drawPickups(t) {
  pickups.forEach(function (p) {
    if (!p.on) return; var x = (p.x - cam) | 0; if (x < -12 || x > W + 4) return;
    var b = ((t >> 3) & 1);
    if (p.t === 'coin') drawSpr('coin', x, p.y + b - 1, false);
    else if (p.t === 'coffee') drawSpr('coffee', x, p.y + b, false);
    else { drawSpr(p.kind, x, p.y + b, false); if ((t >> 4) & 1) rect(x - 1, p.y - 3, 1, 1, C.wh); }
  });
}

function drawFx() {
  fx.forEach(function (f) {
    var x = (f.x - cam) | 0;
    if (f.k === 'text') drawText(f.txt, x, f.y, f.col, 1, 'l', C.k); else rect(x, f.y, 1, 1, f.col);
  });
}

function drawWorld(t) {
  var sx = shake ? ((Math.random() * 3) | 0) - 1 : 0; g.save(); g.translate(sx, 0);
  drawBg(lv, cam | 0, t);
  puddles.forEach(function (p) { var x = (p.x - cam) | 0; if (x > W || x + p.w < 0) return; rect(x, GY + 1, p.w, 3, C.bl); rect(x + 3, GY + 1, p.w - 8, 1, C.wh); rect(x + 2, GY + 4, p.w - 4, 1, C.nb); });
  drawGoal(lv, cam | 0, got >= lv.need, t);
  solids.forEach(function (s) { drawSolid(s, cam | 0); });
  drawPickups(t);
  ents.forEach(function (e) { if (e.t !== 'paper') drawEnemy(e, t); });
  ents.forEach(function (e) { if (e.t === 'paper') drawEnemy(e, t); });
  drawLena((P.x - (cam | 0)) | 0, P.y | 0, t);
  if (P.shoutT > 0) {
    var r = (24 - P.shoutT) * 2.6, cxx = (P.x - (cam | 0) + 6) | 0, cyy = (P.y + 10) | 0; g.strokeStyle = C.ye; g.lineWidth = 1;
    g.beginPath(); g.arc(cxx + .5, cyy + .5, r, 0, 6.3); g.stroke(); bubble('НЕТ!', cxx, P.y - 1, C.rd);
  }
  drawFx(); g.restore();
  drawHUD();
}

// ---------- экраны ----------
function panel(x, y, w, h, col) { rect(x, y, w, h, C.k); rect(x, y, w, 1, col || C.dk); rect(x, y + h - 1, w, 1, col || C.dk); rect(x, y, 1, h, col || C.dk); rect(x + w - 1, y, 1, h, col || C.dk); }

var titleCam = 0;
function drawTitle(t) {
  titleCam += .6;
  drawBg({ theme: 'street' }, titleCam | 0, t);
  rect(0, 0, W, 78, 'rgba(0,0,0,.55)');
  drawText('БУХГАЛТЕРИЯ', 150, 8, C.wh, 2, 'c', C.rd);
  drawText('ВОЗВРАЩАЕТСЯ', 150, 26, C.wh, 2, 'c', C.rd);
  drawText('ДОМОЙ', 150, 46, C.ye, 3, 'c', C.rd);
  var walkF = [1, 2, 3, 2][(t >> 3) & 3];
  drawPerson(52, GY - 20, 1, walkF, PEOPLE.lena);
  drawPerson(10, GY - 20 + 0, 1, [3, 2, 1, 2][(t >> 3) & 3], PEOPLE.boss);
  bubble('ЛЕНА! ОТЧЁТ!', 36, GY - 22, C.rd);
  if ((t >> 5) & 1) drawText('НАЖМИ ENTER', 150, 84, C.ye, 2, 'c', C.k);
  panel(98, 108, 194, 46, C.lv);
  drawText('← →  ХОДИТЬ', 106, 113, C.wh); drawText('ПРОБЕЛ / ↑  ПРЫЖОК', 106, 123, C.wh);
  drawText('X  СКАЗАТЬ «НЕТ!»', 106, 133, C.wh); drawText('P  ПАУЗА    M  ЗВУК', 106, 143, C.lg);
  drawText('ДОЙДИ ДО ДОМА ДО НОЧИ!', 150, 165, C.lg, 1, 'c', C.k);
  drawText('УДАЧИ, ЛЕНА!', 150, 178, C.pk, 1, 'c', C.k);
}

function drawIntro(t) {
  rect(0, 0, W, H, C.k);
  var l = LEVELS[lvIdx];
  drawText('УРОВЕНЬ ' + (lvIdx + 1), 150, 44, C.ye, 2, 'c');
  drawText(l.name, 150, 66, C.wh, 3, 'c', C.rd);
  drawText('ВРЕМЯ ' + l.time, 150, 98, C.lg, 1, 'c');
  drawText(l.intro, 150, 116, C.wh, 1, 'c');
  if (attempts > 1) drawText('ПОПЫТКА ' + attempts, 150, 132, C.dk, 1, 'c');
  drawPerson(144, 140, 1, [1, 2, 3, 2][(t >> 3) & 3], PEOPLE.lena);
  if ((t >> 5) & 1) drawText('ENTER', 150, 178, C.ye, 1, 'c');
}

function drawOver(t) {
  rect(0, 0, W, H, 'rgba(0,0,0,.7)');
  panel(40, 50, 220, 96, C.rd);
  drawText('НЕРВЫ НЕ ВЫДЕРЖАЛИ', 150, 60, C.rd, 2, 'c');
  drawText('ЛЕНА ОСТАЛАСЬ ДЕЛАТЬ ОТЧЁТ...', 150, 84, C.wh, 1, 'c');
  drawText('НА СВЕРХУРОЧНЫХ, БЕЗ УЖИНА.', 150, 95, C.wh, 1, 'c');
  drawText('ПРЕМИЯ: ₽' + score, 150, 112, C.ye, 1, 'c');
  if ((t >> 5) & 1) drawText('ENTER — ЕЩЁ РАЗ', 150, 128, C.gr, 1, 'c');
}
function drawClear(t) {
  panel(50, 60, 200, 60, C.gr);
  drawText('ПУТЬ ПРОЙДЕН!', 150, 68, C.gr, 2, 'c');
  drawText('БОНУС ЗА НЕРВЫ: +' + bonus, 150, 90, C.ye, 1, 'c');
  drawText('ПРЕМИЯ: ₽' + score, 150, 102, C.wh, 1, 'c');
}
function drawPause() { rect(0, 0, W, H, 'rgba(0,0,0,.6)'); drawText('ПАУЗА', 150, 80, C.wh, 3, 'c', C.rd); drawText('P — ПРОДОЛЖИТЬ', 150, 112, C.lg, 1, 'c'); }

// ---------- финал: дома ----------
var finT = 0, dog = null;
function startFinale() { state = 'finale'; finT = 0; }
function drawFinale(t) {
  var f = finT;
  rect(0, 0, W, H, C.pu); for (var x = 0; x < W; x += 12) rect(x, 14, 2, 144, C.br);        // обои
  rect(0, GY - 26, W, 26, C.br); rect(0, GY - 27, W, 1, C.k);
  rect(0, GY, W, H - GY, C.dk); rect(0, GY, W, 1, C.k); for (x = 0; x < W; x += 30) rect(x, GY + 1, 1, H, C.k);
  rect(120, 40, 50, 46, C.k); rect(122, 42, 46, 42, C.nb); rect(144, 42, 2, 42, C.k); rect(122, 62, 46, 2, C.k);
  rect(128, 50, 2, 2, C.wh); rect(156, 70, 2, 2, C.ye); rect(150, 48, 8, 8, C.lg);         // окно, ночь
  rect(8, GY - 34, 20, 34, C.k); rect(10, GY - 32, 16, 32, C.or);                            // дверь
  rect(190, 44, 26, 18, C.wh); rect(192, 46, 22, 14, C.pk); rect(196, 50, 14, 6, C.rd);      // картина
  rect(262, 138, 32, 20, C.br); rect(264, 122, 28, 16, C.k); rect(266, 124, 24, 12, ((t >> 3) & 1) ? C.bl : C.gr); rect(270, 158 - 4, 20, 1, C.k); // тумба + ТВ
  // муж на диване
  rect(200, GY - 32, 54, 20, C.pu); rect(202, GY - 30, 50, 4, C.rd);                              // спинка дивана
  drawPerson(220, GY - 32, -1, 0, PEOPLE.husband);
  rect(200, GY - 16, 54, 16, C.rd); rect(198, GY - 26, 6, 26, C.rd); rect(250, GY - 26, 6, 26, C.rd); rect(200, GY - 3, 54, 3, C.pu);
  rect(216, GY - 17, 8, 2, C.k);  // пульт
  // Лена
  var lx = 30, walking = false;
  if (f < 90) { lx = 30 + f * .9; walking = true; } else lx = 111;
  var lfr = walking ? [1, 2, 3, 2][(f >> 3) & 3] : (f > 400 && (f >> 3) & 1 ? 4 : 0);
  // собака
  if (f > 95) {
    var dx = f < 150 ? 250 - (f - 95) * 2.3 : 128 + Math.sin(f * .3) * 4, dy = GY - 10 - (f > 150 ? Math.abs(Math.sin(f * .2)) * 10 : 0);
    if (f < 150) drawSpr('dogHome', dx | 0, GY - 10, true); else drawSpr('dogHome', dx | 0, dy | 0, true);
    if (f > 150 && f < 260) bubble('ГАВ! ГАВ!', dx + 6, dy - 2, C.br);
  }
  // дети
  if (f > 170) {
    var kx1 = f < 230 ? 290 - (f - 170) * 2.4 : 146, kx2 = f < 240 ? 300 - (f - 170) * 2.3 : 138;
    drawKid(kx1 | 0, GY - 20, -1, f < 230 ? f >> 2 : 0, C.ye, C.br); drawKid(kx2 | 0, GY - 20, -1, f < 240 ? f >> 2 : 0, C.pk, C.or);
    if (f > 225 && f < 320) bubble('МАМА!', 150, GY - 22, C.rd);
  }
  drawPerson(lx | 0, GY - 20, 1, lfr, PEOPLE.lena);
  if (f > 260 && f < 380) bubble('ЛЕНА, ЭТО ТЫ? А ЧТО НА УЖИН?', 200, GY - 44, C.k);
  if (f > 330 && f < 420) bubble('...', lx + 6, GY - 22, C.k);
  if (f > 420) { bubble('ДОМА!', lx + 6, GY - 22, C.rd); if (f % 14 === 0) fx.push({ k: 'text', x: lx - 4 + rnd(0, 20), y: GY - 30, txt: '*', col: C.rd, t: 0 }); }
  fx.forEach(function (q) { drawText(q.txt, q.x | 0, q.y | 0, q.col); }); updateFx();
  if (f > 500) {
    rect(0, 0, W, H, 'rgba(0,0,0,.72)'); panel(30, 40, 240, 108, C.ye);
    drawText('ДОМА!', 150, 48, C.ye, 3, 'c', C.rd);
    drawText('ЛЕНА ВЕРНУЛАСЬ ДОМОЙ,', 150, 78, C.wh, 1, 'c'); drawText('УЖИН ПОДОЖДЁТ ДО ЗАВТРА.', 150, 89, C.wh, 1, 'c');
    drawText('ИТОГОВАЯ ПРЕМИЯ: ₽' + score, 150, 106, C.ye, 1, 'c');
    drawText('С ЛЮБОВЬЮ К БУХГАЛТЕРАМ', 150, 120, C.pk, 1, 'c');
    if ((t >> 5) & 1) drawText('ENTER — ИГРАТЬ СНОВА', 150, 134, C.gr, 1, 'c');
  }
}

// ---------- главный цикл ----------
function newGame() { score = 0; attempts = 1; loadLevel(0); state = 'intro'; stTimer = 0; }
function startLevelPlay() { state = 'play'; }
function nextLevel() {
  if (lvIdx + 1 >= LEVELS.length) { fx = []; startFinale(); return; }
  attempts = 1; loadLevel(lvIdx + 1); state = 'intro'; stTimer = 0;
}

function update() {
  tick++;
  if (hit(K_MUTE)) { muted = !muted; if (!muted) sfx('blip'); }
  switch (state) {
    case 'title': if (hit(['Enter', 'Space'])) { newGame(); sfx('blip'); } break;
    case 'intro': stTimer++; if (hit(['Enter', 'Space']) || stTimer > 260) startLevelPlay(); break;
    case 'play':
      if (hit(K_PAUSE)) { state = 'pause'; break; }
      updatePlayer(true); updateEnemies(); collect(); updateFx(); break;
    case 'pause': if (hit(K_PAUSE)) state = 'play'; break;
    case 'over': stTimer++; updateFx(); if (stTimer > 30 && hit(['Enter', 'Space'])) { score = scoreAtStart; attempts++; loadLevel(lvIdx); state = 'intro'; stTimer = 0; } break;
    case 'clear': stTimer++; updatePlayer(false); updateFx(); if (stTimer > 140 || (stTimer > 30 && hit(['Enter', 'Space']))) nextLevel(); break;
    case 'finale': finT++; if (finT > 500 && hit(['Enter', 'Space'])) { state = 'title'; } break;
  }
  pressedNow = {};
}

function render() {
  g.imageSmoothingEnabled = false;
  switch (state) {
    case 'title': drawTitle(tick); break;
    case 'intro': drawIntro(tick); break;
    case 'finale': drawFinale(tick); break;
    default:
      drawWorld(tick);
      if (state === 'over') drawOver(tick);
      else if (state === 'clear') drawClear(tick);
      else if (state === 'pause') drawPause();
  }
  if (muted) drawText('ЗВУК ВЫКЛ', W - 3, H - 9, C.dk, 1, 'r');
  mc.imageSmoothingEnabled = false; mc.drawImage(screenCv, 0, 0, 900, 600);
}

var last = 0, acc = 0;
function frame(ts) {
  if (!last) last = ts; acc += Math.min(100, ts - last); last = ts;
  while (acc >= 16.667) { update(); acc -= 16.667; }
  render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
